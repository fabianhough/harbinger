[project]
name = "harbinger"
version = "0.1.0"
description = "A front-entrance dashboard that foreshadows the day."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "jsonschema[format]>=4.23",
  "httpx2>=2",
  "gtfs-realtime-bindings>=1.0",
]

[project.scripts]
harbinger = "harbinger.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbinger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
